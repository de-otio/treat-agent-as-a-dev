name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] || python -m pip install -e .
          python -m pip install pytest
      - name: smoke
        run: |
          python -m taaad --version
          python -m taaad --help
          python -m taaad doctor
      - name: pytest
        env:
          # Ubuntu's keyring needs a session bus; dbus-launch supplies one.
          # On macOS/Windows the test fixture monkeypatches the backend so
          # the real OS store is never touched.
          PYTHONUNBUFFERED: "1"
        run: |
          pytest -q
